<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Ficha - O Trono de Seda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#14100d; --s1:#1d1712; --s2:#2a2018; --track:#2b2118; --line:#3d3022;
  --text:#efe4cb; --muted:#a69878; --gold:#c9a24a; --gold2:#e8cb84; --on-gold:#1a130b;
  --pv:#cc4631; --pe:#d9a83c; --san:#5f80cc; --def:#8a9a9c;
  --fome:#dc8f45; --sede:#62aedb; --good:#5eaa80; --warn:#d9a83c; --bad:#e0624a;
  --serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme=light]{
  --bg:#f0e8d3; --s1:#f8f2e2; --s2:#e9dfc4; --track:#9c8f72; --line:#cbbb94;
  --text:#2b2219; --muted:#76684b; --gold:#8c6a1c; --gold2:#6f5314; --on-gold:#fff8e6;
  --pv:#b53a27; --pe:#a97a12; --san:#3f61ad; --def:#66787a;
  --fome:#b8691f; --sede:#2f86b8; --good:#2f7d56; --warn:#a97a12; --bad:#b53a27;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
svg{display:block}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* cabeçalho */
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:flex-start;padding:12px 14px 10px;background:var(--bg);border-bottom:1px solid var(--gold)}
.id{flex:1;min-width:0}
.nome{display:block;width:100%;padding:2px 0;border:0;border-bottom:1px dashed transparent;background:transparent;font:800 22px/1.15 var(--serif)}
.orig{display:block;width:100%;padding:2px 0;border:0;border-bottom:1px dashed transparent;background:transparent;font-size:13px;color:var(--muted)}
.nome:hover,.nome:focus,.orig:hover,.orig:focus{border-bottom-color:var(--line)}
.tools{display:flex;align-items:center;gap:8px;padding-top:4px}
.st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.st[data-s=saving] i{background:var(--warn)}
.st[data-s=error] i{background:var(--bad)}
.st[data-s=local] i{background:var(--muted)}
.x{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--s1);font-size:20px;line-height:1;padding:0}
.bn{padding:6px 14px;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:13px}

/* seções */
main{padding:0 14px 48px}
section{padding:16px 0 10px;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
h2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px;font:800 18px/1.2 var(--serif);color:var(--gold2)}
h3{margin:14px 0 6px;font:700 14px var(--serif)}
.hint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.empty{margin:6px 0;color:var(--muted)}
.cnt{display:flex;align-items:center;gap:8px;font:500 13px var(--sans);color:var(--muted)}
.btn{border:1px solid var(--line);border-radius:6px;background:var(--s1);padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.danger{color:var(--bad)}
.btn[data-armed]{background:var(--bad);border-color:var(--bad);color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;background:var(--s1);padding:4px 12px;font-size:13px}
.chip.sm{padding:2px 10px;font-size:12px}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.passo{display:flex;align-items:center;gap:5px;font:500 12px var(--sans);color:var(--muted)}

/* vitais */
.vit{display:grid;grid-template-columns:58px 1fr 76px;gap:8px;align-items:center;margin-bottom:10px}
.vit .lb{display:block;font:800 16px/1.1 var(--serif)}
.vit .pct{display:block;font-size:11.5px;color:var(--muted)}
.bar{position:relative;height:30px;border-radius:5px;background:var(--track);border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);transition:width .2s}
.bar .tk{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.4)}
.nums{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75)}
.nums input{width:4.2ch;padding:2px 0;border:0;border-radius:3px;background:transparent;text-align:center;font-weight:700;color:#fff;text-shadow:inherit}
.nums input:focus{background:rgba(0,0,0,.5)}
.step{display:flex;gap:4px}
.step button{flex:1;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--s1);font-size:18px;font-weight:700;line-height:1;padding:0}
.step button:active{background:var(--s2)}

/* fome e sede */
.need{margin-bottom:12px}
.need .row{display:flex;align-items:center;gap:8px}
.need .lb{width:50px;font:800 15px var(--serif)}
.icons{display:flex;gap:2px}
.ic{width:36px;height:36px;padding:4px;border:0;background:transparent;color:var(--c);opacity:.28}
.ic[aria-pressed=true]{opacity:1}
.ic svg{width:100%;height:100%}
.val{margin-left:auto;font-weight:700;color:var(--muted)}
.stage{margin:2px 0 0 58px;font-size:12.5px;color:var(--muted)}
.stage b{color:var(--sc,var(--text))}
.stage[data-s=ok]{--sc:var(--good)} .stage[data-s=warn]{--sc:var(--warn)}
.stage[data-s=bad],.stage[data-s=crit]{--sc:var(--bad)}

/* inventário em cartas */
.meter{display:flex;gap:3px}
.meter i{width:14px;height:6px;border-radius:2px;background:var(--track)}
.meter i.on{background:var(--gold)}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:5/6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;overflow:hidden;border:1.5px dashed var(--line);border-radius:7px;background:var(--s1)}
.slot .kj{font:800 36px/1 var(--serif);color:var(--line)}
.slot .tg{font-size:12px;color:var(--muted)}
.slot:hover{border-color:var(--gold)}
.slot.full{border:1.5px solid var(--gold);background:#0000004d}
.slot.full img{display:block;width:100%;height:100%;object-fit:contain}
.slot .tag{position:absolute;left:0;right:0;bottom:0;padding:10px 6px 3px;text-align:left;font-size:11px;color:#fff;background:linear-gradient(transparent,#000000cc)}

/* adrenalina */
.pa{display:grid;gap:6px}
.pa .row{display:flex;align-items:center;gap:6px}
.pa .tr{width:22px;height:22px;margin-right:4px;color:var(--muted)}
.pip{width:40px;height:40px;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--s1);color:var(--gold)}
.pip svg{width:100%;height:100%;opacity:.22}
.pip[aria-pressed=true] svg{opacity:1}
.ch{padding:8px 0;border-top:1px solid var(--line)}
.ch .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ch .pcw{width:62px}
.ch .pc{display:block;font:800 16px/1.1 var(--serif)}
.ch.hit .pc{color:var(--bad)}
.hitlb{display:none;font-size:11.5px;color:var(--bad)}
.ch.hit .hitlb{display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--s1);padding:6px 7px;font-size:12px}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--on-gold);font-weight:700}
.seg button[data-v="1"][aria-pressed=true]{background:var(--good);color:#fff}
.seg button[data-v="2"][aria-pressed=true]{background:var(--bad);color:#fff}
.dado{margin-left:auto}
.fx{margin:5px 0 0;font-size:12.5px;color:var(--muted)}
.fx b{color:var(--text)}

/* rituais */
.rit{margin-bottom:8px;border:1px solid var(--line);border-radius:7px;background:var(--s1)}
.rit>summary{display:flex;align-items:center;gap:8px;padding:10px 12px;list-style:none;cursor:pointer}
.rit>summary::-webkit-details-marker{display:none}
.rit[open]>summary{border-bottom:1px solid var(--line)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.rit .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:700 15px var(--serif)}
.tag2{flex:none;padding:1px 8px;border:1px solid var(--line);border-radius:999px;font-size:11.5px;color:var(--muted)}
.bd{display:grid;gap:10px;padding:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
.f textarea{min-height:68px;resize:vertical}
.ver{display:grid;gap:6px;padding-left:10px;border-left:3px solid var(--vc)}
.ver.d{--vc:var(--san)} .ver.v{--vc:var(--pv)}
.ver .vh{display:flex;align-items:center;justify-content:space-between;font:700 14px var(--serif)}
.ver .vh label{display:flex;align-items:center;gap:6px;font:500 12px var(--sans);color:var(--muted)}
.ver .vh input{width:5ch;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center}
.ver textarea{min-height:56px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text);resize:vertical}
.costs{display:flex;gap:6px;flex-wrap:wrap}
.costs span{padding:2px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px}
.costs .d{border-color:var(--san)} .costs .v{border-color:var(--pv)}

/* janelas */
dialog{width:100%;height:100%;max-width:none;max-height:none;margin:0;inset:0;padding:0;border:0;background:var(--bg);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--gold)}
.dlg h3{margin:0;font:800 17px var(--serif);color:var(--gold2)}
.dlg .body{flex:1;overflow:auto;padding:12px 14px}
.dlg .acts{margin:0;padding:10px 14px;border-top:1px solid var(--line)}
.filters{display:grid;gap:8px;padding:10px 14px 4px}
.filters input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--s1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.cp{display:grid;gap:4px;padding:0;border:0;background:none;text-align:center;font-size:12px;line-height:1.2}
.cp img{width:100%;aspect-ratio:5/6;object-fit:contain;border-radius:7px;background:var(--s1)}
.cp:hover img{outline:2px solid var(--gold)}
.cv{display:grid;place-items:center}
.cv img{max-width:100%;max-height:100%;object-fit:contain}
.lst{display:grid;gap:8px}
.lst button{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--s1);text-align:left}
.lst button:hover:not(:disabled){border-color:var(--gold)}
.lst button:disabled{opacity:.5;cursor:default}
.lst .nm{flex:1;font:700 15px var(--serif)}
#bk{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--s1);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
#toast{position:fixed;inset:auto 12px 12px 12px;width:auto;height:auto;margin:0;z-index:50;padding:10px 12px;border:1px solid var(--gold);border-radius:7px;background:var(--s2);color:var(--text);opacity:0;pointer-events:none;transition:opacity .2s;overflow:visible}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-fish" viewBox="0 0 24 24"><path fill="currentColor" d="M2.500 12c3.200-5.200 8.600-6.200 12.500-3L19.500 5.500v13L15 15c-3.900 3.200-9.300 2.200-12.500-3z"/><circle cx="8" cy="11" r="1.200" fill="var(--bg)"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.500C9 7 6 10.200 6 14.500a6 6 0 0 0 12 0c0-4.300-3-7.500-6-12z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20.800C6 16.500 3 13.300 3 9.600 3 7 5 5 7.500 5c1.800 0 3.300 1 4.500 2.800C13.200 6 14.700 5 16.500 5 19 5 21 7 21 9.600c0 3.700-3 6.900-9 11.200z"/></symbol>
  <symbol id="i-poly" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.500l8.500 5v9L12 21.500l-8.500-5v-9z"/><path d="M12 7.500l4.600 8H7.400z" fill="none" stroke="var(--s1)" stroke-width="1.500" stroke-linejoin="round"/></symbol>
  <symbol id="i-brain" viewBox="0 0 24 24"><path fill="currentColor" d="M9.500 4A3 3 0 0 0 6.500 7a3.200 3.200 0 0 0-2.200 4.600A3.600 3.600 0 0 0 6.600 17 3 3 0 0 0 9.500 20.500h1V4zM14.500 4a3 3 0 0 1 3 3 3.200 3.200 0 0 1 2.200 4.600A3.600 3.600 0 0 1 17.400 17a3 3 0 0 1-2.900 3.500h-1V4z"/></symbol>
</svg>

<header class="top">
  <div class="id">
    <input class="nome" data-top="nome" maxlength="40" placeholder="Nome do personagem" aria-label="Nome do personagem">
    <input class="orig" data-top="origem" maxlength="70" placeholder="Origem, trilha e NEX" aria-label="Origem, trilha e NEX">
  </div>
  <div class="tools">
    <span class="st" id="st" role="status" data-s="saved"><i></i><span>Pronta</span></span>
    <button class="x" data-act="menu" aria-label="Opções da ficha">&#8943;</button>
  </div>
</header>
<div class="bn" id="bn" hidden></div>

<main>
  <section id="sec-vit"></section>
  <section id="sec-need"></section>
  <section id="sec-inv"></section>
  <section id="sec-adr"></section>
  <section id="sec-rit"></section>
</main>

<!-- escolher carta -->
<dialog id="dlgPick" aria-label="Escolher carta">
  <div class="dlg">
    <header><h3 id="pkTitle">Escolher carta</h3><button class="x" data-act="close" data-d="dlgPick" aria-label="Fechar">&times;</button></header>
    <div class="filters">
      <input id="pkQ" type="search" placeholder="Buscar carta pelo nome" aria-label="Buscar carta pelo nome" autocomplete="off">
      <div class="chips" id="pkTabs"></div>
      <div class="chips" id="pkRar"></div>
    </div>
    <div class="body"><div class="pick" id="pkGrid"></div></div>
  </div>
</dialog>

<!-- ver carta -->
<dialog id="dlgCard" aria-label="Carta do inventário">
  <div class="dlg">
    <header><h3 id="cvTitle"></h3><button class="x" data-act="close" data-d="dlgCard" aria-label="Fechar">&times;</button></header>
    <div class="body cv"><img id="cvImg" alt=""></div>
    <div class="acts"><button class="btn" data-act="trocar">Trocar carta</button><button class="btn danger" data-act="remover">Remover do inventário</button></div>
  </div>
</dialog>

<!-- rituais do suplemento -->
<dialog id="dlgRit" aria-label="Rituais do suplemento">
  <div class="dlg">
    <header><h3>Rituais do suplemento</h3><button class="x" data-act="close" data-d="dlgRit" aria-label="Fechar">&times;</button></header>
    <div class="body"><div class="lst" id="ritList"></div></div>
  </div>
</dialog>

<!-- opções -->
<dialog id="dlgMenu" aria-label="Opções da ficha">
  <div class="dlg">
    <header><h3>Opções da ficha</h3><button class="x" data-act="close" data-d="dlgMenu" aria-label="Fechar">&times;</button></header>
    <div class="body">
      <div id="gmBox" hidden>
        <label class="f">Ficha em exibição
          <select id="selFicha"></select>
        </label>
        <p class="hint">Esta lista aparece só para o mestre.</p>
      </div>
      <h3>Cópia de segurança</h3>
      <textarea id="bk" rows="6" spellcheck="false" aria-label="Dados da ficha em JSON"></textarea>
      <div class="acts" style="margin-top:8px;padding:0;border:0"><button class="btn" data-act="bk-copy">Copiar</button><button class="btn" data-act="bk-load">Importar o texto acima</button></div>
      <h3>Armazenamento</h3>
      <p class="hint" id="sizeInfo"></p>
      <h3>Limpar</h3>
      <button class="btn danger" data-act="reset">Limpar esta ficha</button>
    </div>
  </div>
</dialog>

<datalist id="dl-exec"><option>Padrão</option><option>Movimento</option><option>Completa</option><option>Livre</option><option>Reação</option></datalist>
<datalist id="dl-alc"><option>Pessoal</option><option>Toque</option><option>Curto</option><option>Médio</option><option>Longo</option><option>Extremo</option></datalist>
<datalist id="dl-dur"><option>Instantâneo</option><option>Cena</option><option>Sustentada</option><option>Contínua</option></datalist>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* ============================================================
   Ficha - O Trono de Seda (extensão para Owlbear Rodeo 2.0)
   ============================================================ */
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';
const NS = 'com.trono-de-seda.ficha';          // prefixo das chaves no metadata da sala
const LS = id => 'trono-de-seda:' + id;         // cópia local (localStorage)

/* ---------- utilidades ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const int = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : 0; };
const str = v => (v == null ? '' : String(v));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const bytes = o => new TextEncoder().encode(JSON.stringify(o)).length;

/* ---------- modelo da ficha ---------- */
const blank = (nome = '') => ({
  nome, origem: '',
  pv: { a:0, m:0 }, pe: { a:0, m:0 }, san: { a:0, m:0 }, def: { a:0, m:0 },
  fome: 5, sede: 5,
  inv: ['', '', '', '', '', ''],
  pa: [0, 0, 0],
  choque: { c:[0, 0, 0], r:[0, 0, 0] },
  rituais: [],
});

function normRitual(r) {
  return {
    id: r.id || uid(), pid: r.pid || '',
    nome: str(r.nome), elem: str(r.elem), circ: clamp(int(r.circ) || 1, 1, 4), custo: Math.max(0, int(r.custo)),
    exec: str(r.exec), alc: str(r.alc), alvo: str(r.alvo), dur: str(r.dur), desc: str(r.desc),
    dis: { c: Math.max(0, int(r.dis?.c)), t: str(r.dis?.t) },
    ver: { c: Math.max(0, int(r.ver?.c)), t: str(r.ver?.t) },
  };
}
const expandRitual = r => normRitual(PRESETS[r.pid] ? { ...clone(PRESETS[r.pid]), ...r } : r);

function normalize(d) {
  d = d || {};
  const s = blank(str(d.nome).slice(0, 40));
  s.origem = str(d.origem).slice(0, 70);
  for (const k of ['pv', 'pe', 'san', 'def']) s[k] = { a: Math.max(0, int(d[k]?.a)), m: Math.max(0, int(d[k]?.m)) };
  s.fome = clamp(d.fome == null ? 5 : int(d.fome), 0, 5);
  s.sede = clamp(d.sede == null ? 5 : int(d.sede), 0, 5);
  s.inv = Array.from({ length: 6 }, (_, i) => (byId.has(d.inv?.[i]) ? d.inv[i] : ''));
  s.pa = [0, 1, 2].map(i => clamp(int(d.pa?.[i]), 0, 3));
  s.choque = {
    c: [0, 1, 2].map(i => clamp(int(d.choque?.c?.[i]), 0, 2)),
    r: [0, 1, 2].map(i => clamp(int(d.choque?.r?.[i]), 0, 100)),
  };
  s.rituais = (Array.isArray(d.rituais) ? d.rituais : []).slice(0, 40).map(expandRitual);
  return s;
}

/* compacta para caber no limite de 16 kB do metadata da sala */
function strip(o) {
  if (Array.isArray(o)) return o.map(strip);
  if (o && typeof o === 'object') {
    const r = {};
    for (const [k, v] of Object.entries(o)) {
      const x = strip(v);
      if (x === '' || x == null || (typeof x === 'object' && !Array.isArray(x) && !Object.keys(x).length)) continue;
      r[k] = x;
    }
    return r;
  }
  return o;
}
function packRitual(r) {
  const base = PRESETS[r.pid];
  if (!base) { const o = { ...r }; delete o.pid; return strip(o); }
  const o = { id: r.id, pid: r.pid };           // ritual do suplemento: grava só o que foi alterado
  for (const k of Object.keys(base)) if (JSON.stringify(r[k]) !== JSON.stringify(base[k])) o[k] = r[k];
  return o;
}
const pack = s => ({ ...strip({ ...s, rituais: [] }), rituais: s.rituais.map(packRitual) });

function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch { /* storage bloqueado */ } }
function readLocal(pid) { try { return JSON.parse(safeGet(LS(pid))); } catch { return null; } }

/* ---------- persistência (metadata da sala) ---------- */
const mkKey = pid => NS + '/' + pid;
const collect = md => {
  const o = {};
  for (const [k, v] of Object.entries(md || {})) if (k.startsWith(NS + '/') && v && typeof v === 'object') o[k.slice(NS.length + 1)] = v;
  return o;
};

function setStatus(s, txt) {
  const el = $('#st'); el.dataset.s = s; $('span', el).textContent = txt;
}
function touch() {
  if (!ctx.ready) return;
  safeSet(LS(view.pid), JSON.stringify(pack(S)));
  if (ctx.local) { setStatus('local', 'Só neste navegador'); return; }
  setStatus('saving', 'Salvando…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
}
async function flush() {
  clearTimeout(saveTimer); saveTimer = 0;
  if (ctx.local || !OBR) return;
  const d = pack(S);
  const rec = { n: S.nome, p: sheets[view.pid]?.p || (view.pid === ctx.pid ? ctx.pname : ''), t: Date.now(), d };
  lastSent = JSON.stringify(d);
  try {
    await OBR.room.setMetadata({ [mkKey(view.pid)]: rec });
    sheets[view.pid] = rec;
    setStatus('saved', 'Salva na sala');
  } catch (e) {
    console.error(e);
    setStatus('error', 'Falha ao salvar na sala');
    toast('Não consegui salvar na sala (limite de 16 kB ou sem permissão). A ficha continua guardada neste navegador.');
  }
}
function updateSize() {
  $('#sizeInfo').textContent = ctx.local
    ? 'Fora do Owlbear Rodeo: a ficha fica salva só neste navegador.'
    : `Metadata da sala: ${(bytes(lastMd) / 1024).toFixed(1)} kB de 16 kB. Esta ficha: ${(bytes(pack(S)) / 1024).toFixed(1)} kB.`;
}

function editingInside() {
  const a = document.activeElement;
  return !!a && a !== document.body && !!a.closest('main, .top');
}
function onRoomMeta(md) {
  lastMd = md || {}; sheets = collect(md);
  fillSelect(); updateSize();
  const rec = sheets[view.pid];
  if (!rec) return;
  const incoming = JSON.stringify(rec.d);
  if (incoming === lastSent || incoming === JSON.stringify(pack(S))) return;   // eco da própria gravação
  if (saveTimer) return;                                                       // edição local pendente vence
  if (editingInside()) { pendingRemote = rec; return; }
  S = normalize(rec.d); renderAll(); setStatus('saved', 'Atualizada pela sala');
}

/* ---------- toast ---------- */
let tt = 0;
const hasPopover = typeof HTMLElement.prototype.showPopover === 'function';
if (hasPopover) $('#toast').setAttribute('popover', 'manual');   // camada superior: aparece acima das janelas abertas
function toast(m) {
  const t = $('#toast'); t.textContent = m;
  if (hasPopover && !t.matches(':popover-open')) { try { t.showPopover(); } catch { /* ignora */ } }
  requestAnimationFrame(() => t.classList.add('on'));
  clearTimeout(tt);
  tt = setTimeout(() => {
    t.classList.remove('on');
    if (hasPopover) setTimeout(() => { try { t.hidePopover(); } catch { /* ignora */ } }, 220);
  }, 3200);
}

function setRitField(r, f, v) {

function armed(btn, label, done) {                   // confirmação em dois toques (sem confirm())
  if (btn.dataset.armed) { done(); return; }
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = 'Toque de novo para confirmar';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  switch (a) {
    case 'passo': passo = int(t.dataset.v); safeSet('trono-de-seda:passo', passo); $$('[data-act="passo"]').forEach(b => b.setAttribute('aria-pressed', int(b.dataset.v) === passo)); break;
    case 'adj': {
      const v = S[t.dataset.k], d = int(t.dataset.d) * passo;
      let n = Math.max(0, v.a + d);
      if (d > 0 && v.m > 0) n = Math.min(n, Math.max(v.m, v.a));
      v.a = n; refreshVit(); touch(); break;
    }
    case 'need': { const k = t.dataset.k, v = int(t.dataset.v); S[k] = S[k] === v ? v - 1 : v; renderNeed(); touch(); break; }
    case 'horas': S.fome = Math.max(0, S.fome - 1); S.sede = Math.max(0, S.sede - 1); renderNeed(); touch(); toast('−1 em Fome e Sede (2 h dentro do universo).'); break;
    case 'slot': { const i = int(t.dataset.i); S.inv[i] ? openViewer(i) : openPicker(i); break; }
    case 'tab': pk.tab = t.dataset.v; renderPick(); break;
    case 'rar': pk.rar = t.dataset.v; renderPick(); break;
    case 'pick': S.inv[pk.slot] = t.dataset.id; $('#dlgPick').close(); renderInv(); touch(); break;
    case 'trocar': $('#dlgCard').close(); openPicker(cv.i); break;
    case 'remover': S.inv[cv.i] = ''; $('#dlgCard').close(); renderInv(); touch(); break;
    case 'pa': { const r = int(t.dataset.r), v = int(t.dataset.v); S.pa[r] = S.pa[r] === v ? v - 1 : v; renderAdr(); touch(); break; }
    case 'ch': { const i = int(t.dataset.i), v = int(t.dataset.v); S.choque.c[i] = v; if (!v) S.choque.r[i] = 0; renderAdr(); touch(); break; }
    case 'd100': {
      const i = int(t.dataset.i); let r;
      do { r = Math.floor(Math.random() * 100) + 1; } while (r === 50);   // 50: rola de novo
      S.choque.r[i] = r; S.choque.c[i] = r <= 49 ? 2 : 1; renderAdr(); touch();
      toast(`d100 em ${BAR[i]}%: ${r}. ${r <= 49 ? 'Instabilidade' : 'Adrenalina'}.`); break;
    }
    case 'cena': S.choque = { c: [0, 0, 0], r: [0, 0, 0] }; renderAdr(); touch(); toast('Teste de Choque zerado para a nova cena.'); break;
    case 'rit-add': { const r = normRitual({ circ: 1, custo: CUSTO[1] }); S.rituais.push(r); openRit.add(r.id); renderRit(); touch(); $(`details.rit[data-id="${r.id}"]`)?.scrollIntoView({ block: 'center' }); break; }
    case 'rit-cat': openRitCatalog(); break;
    case 'rit-pick': {
      const id = t.dataset.id; if (S.rituais.some(r => r.pid === id)) break;
      const r = expandRitual({ id: uid(), pid: id }); S.rituais.push(r); openRit.add(r.id);
      $('#dlgRit').close(); renderRit(); touch(); $(`details.rit[data-id="${r.id}"]`)?.scrollIntoView({ block: 'center' }); break;
    }
    case 'rit-del': armed(t, 'Remover ritual', () => { S.rituais = S.rituais.filter(r => r.id !== t.dataset.id); openRit.delete(t.dataset.id); renderRit(); touch(); }); break;
    case 'menu': $('#bk').value = JSON.stringify(pack(S)); updateSize(); fillSelect(); $('#dlgMenu').showModal(); break;
    case 'close': $('#' + t.dataset.d).close(); break;
    case 'bk-copy': {
      const ta = $('#bk'); ta.select();
      (navigator.clipboard?.writeText(ta.value) ?? Promise.reject()).then(() => toast('Copiado.'), () => { document.execCommand('copy'); toast('Copiado.'); }); break;
    }
    case 'bk-load':
      try { S = normalize(JSON.parse($('#bk').value)); $('#dlgMenu').close(); renderAll(); touch(); toast('Ficha importada.'); }
      catch { toast('Texto inválido. Cole aqui o JSON copiado de uma ficha.'); }
      break;
    case 'reset': armed(t, 'Limpar esta ficha', () => { S = blank(view.pid === ctx.pid ? ctx.pname : S.nome); openRit.clear(); $('#dlgMenu').close(); renderAll(); touch(); toast('Ficha limpa.'); }); break;
  }
});

});

/* ---------- tema (segue o Owlbear Rodeo) ---------- */
const applyTheme = th => { document.documentElement.dataset.theme = th?.mode === 'LIGHT' ? 'light' : 'dark'; };

/* ---------- inicialização ---------- */
async function boot() {
  try { OBR = (await import(SDK_URL)).default; } catch (e) { console.warn('SDK do Owlbear indisponível; abrindo em modo local.', e); OBR = null; }

  if (OBR && OBR.isAvailable) {
    ctx.local = false;
    await new Promise(res => (OBR.isReady ? res() : OBR.onReady(res)));
    ctx.pid = OBR.player.id || (OBR.player.getId ? await OBR.player.getId() : 'jogador');
    ctx.pname = await OBR.player.getName();
    ctx.role = await OBR.player.getRole();
    try { applyTheme(await OBR.theme.getTheme()); OBR.theme.onChange(applyTheme); } catch { /* sem tema */ }
    const md = await OBR.room.getMetadata();
    lastMd = md || {}; sheets = collect(md);
    view = { pid: ctx.pid };
    const rec = sheets[ctx.pid], bk = readLocal(ctx.pid);
    S = rec ? normalize(rec.d) : bk ? normalize(bk) : blank(ctx.pname);
    ctx.ready = true;
    if (!rec && bk) touch();                          // havia cópia local e a sala ainda não tinha: sobe para a sala
    OBR.room.onMetadataChange(onRoomMeta);
    try { OBR.player.onChange(p => { if (p.role !== ctx.role) { ctx.role = p.role; fillSelect(); } }); } catch { /* opcional */ }
    setStatus('saved', rec ? 'Salva na sala' : 'Nova ficha');
  } else {
    const bk = readLocal('local');
    S = bk ? normalize(bk) : blank('');
    ctx.ready = true;
    setStatus('local', 'Só neste navegador');
  }
  renderAll(); fillSelect();
}
boot();
</script>
</body>
</html>
